name: Compilar DiskVault Clean (Windows x64)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar automáticamente como actualización en GitHub Releases'
        required: false
        default: true
        type: boolean
      release_notes:
        description: 'Detalle de novedades personalizado (opcional; si se deja vacío usa RELEASE_NOTES.md)'
        required: false
        default: ''
        type: string
      skip_tests:
        description: 'Omitir pruebas unitarias (compilación más rápida)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Instalador NSIS (.exe) + Portable (.zip)
    runs-on: windows-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Rust estable (Windows MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Caché de dependencias de Rust (Cargo)
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: src-tauri

      - name: Instalar dependencias de Node.js
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Detectar versión y notas de actualización
        id: meta
        shell: pwsh
        run: |
          $conf = Get-Content -Path 'src-tauri/tauri.conf.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $ver = [string]$conf.version
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $customNotes = $env:CUSTOM_RELEASE_NOTES
          if (-not [string]::IsNullOrWhiteSpace($customNotes)) {
            Set-Content -Path 'release_notes_resolved.md' -Value $customNotes -Encoding UTF8
          } elseif (Test-Path 'RELEASE_NOTES.md') {
            Copy-Item -Path 'RELEASE_NOTES.md' -Destination 'release_notes_resolved.md' -Force
          } else {
            Set-Content -Path 'release_notes_resolved.md' -Value "Actualización oficial DiskVault Clean v$ver para Windows x64." -Encoding UTF8
          }
        env:
          CUSTOM_RELEASE_NOTES: ${{ inputs.release_notes }}

      - name: Compilar y empaquetar Instalador .exe y Portable .zip
        shell: pwsh
        run: |
          if ("${{ inputs.skip_tests }}" -eq "true") {
            & .\scripts\build-releases.ps1 -SkipTests
          } else {
            & .\scripts\build-releases.ps1
          }

      - name: Subir artefactos descargables (.exe, .zip y SHA256SUMS.txt)
        uses: actions/upload-artifact@v4
        with:
          name: DiskVaultClean-Windows-x64
          path: |
            release/DiskVaultClean_v*_Setup_x64.exe
            release/DiskVaultClean_v*_Portable_x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar GitHub Release automático para el auto-actualizador
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release != false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.meta.outputs.tag }}
          name: DiskVault Clean ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.meta.outputs.tag }}
          body_path: release_notes_resolved.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/DiskVaultClean_v*_Setup_x64.exe
            release/DiskVaultClean_v*_Portable_x64.zip
            release/SHA256SUMS.txt

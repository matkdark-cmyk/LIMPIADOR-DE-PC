name: Compilar DiskVault Clean (Windows x64)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar automáticamente como actualización en GitHub Releases'
        required: false
        default: true
        type: boolean
      release_notes:
        description: 'Detalle de novedades que verán los usuarios en la ventana de actualización'
        required: false
        default: ''
        type: string
      skip_tests:
        description: 'Omitir pruebas unitarias (compilación más rápida)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Instalador NSIS (.exe) + Portable (.zip)
    runs-on: windows-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Rust estable (Windows MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Caché de dependencias de Rust (Cargo)
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: src-tauri

      - name: Instalar dependencias de Node.js
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Detectar versión desde tauri.conf.json
        id: meta
        shell: pwsh
        run: |
          $conf = Get-Content -Path 'src-tauri/tauri.conf.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $ver = [string]$conf.version
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Compilar y empaquetar Instalador .exe y Portable .zip
        shell: pwsh
        run: |
          if ("${{ inputs.skip_tests }}" -eq "true") {
            & .\scripts\build-releases.ps1 -SkipTests
          } else {
            & .\scripts\build-releases.ps1
          }

      - name: Subir artefactos descargables (.exe, .zip y SHA256SUMS.txt)
        uses: actions/upload-artifact@v4
        with:
          name: DiskVaultClean-Windows-x64
          path: |
            release/DiskVaultClean_v*_Setup_x64.exe
            release/DiskVaultClean_v*_Portable_x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar GitHub Release automático (tags v* o activado manualmente)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.meta.outputs.tag }}
          name: DiskVault Clean ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.meta.outputs.tag }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
          files: |
            release/DiskVaultClean_v*_Setup_x64.exe
            release/DiskVaultClean_v*_Portable_x64.zip
            release/SHA256SUMS.txt
